[project]
name = "eaval"
version = "0.0.1"
description = "Core library of e-aval-electoral: aval XML generation, normalisation, validation and delivery ZIPs"
requires-python = ">=3.11"
dependencies = ["lxml>=5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
